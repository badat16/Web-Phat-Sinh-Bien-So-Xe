<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALPR Mobile Generator</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .preview-box {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 180px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            max-width: 95%;
            height: auto;
            border-radius: 4px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .field {
            flex: 1;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #94a3b8;
            text-transform: uppercase;
        }
        input, select {
            width: 100%;
            height: 48px;
            padding: 0 12px;
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            width: 100%;
            height: 48px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-random {
            background-color: #059669;
            color: #fff;
        }
        .btn-random:active {
            background-color: #047857;
        }
        .btn-download {
            background-color: #2563eb;
            color: #fff;
        }
        .btn-download:active {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="preview-box card">
        <canvas id="plateCanvas"></canvas>
    </div>

    <div class="card">
        <div class="input-group">
            <div class="field">
                <label for="plateType">Loại Biển</label>
                <select id="plateType">
                    <option value="square">Vuông (Ngắn)</option>
                    <option value="long">Dài</option>
                </select>
            </div>
            <div class="field">
                <label for="plateColor">Màu Nền</label>
                <select id="plateColor">
                    <option value="white">Trắng</option>
                    <option value="yellow">Vàng</option>
                    <option value="blue">Xanh</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <div class="field">
                <label for="line1">Dòng 1 (4 ký tự)</label>
                <input type="text" id="line1" value="51F1" maxlength="4">
            </div>
            <div class="field">
                <label for="line2">Dòng 2 (5-6 ký tự)</label>
                <input type="text" id="line2" value="888.88" maxlength="6">
            </div>
        </div>

        <div class="btn-group">
            <button type="button" class="btn-random" id="randomBtn">TẠO NGẪU NHIÊN</button>
            <button type="button" class="btn-download" id="downloadBtn">LƯU ẢNH</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('plateCanvas');
const ctx = canvas.getContext('2d');

const plateType = document.getElementById('plateType');
const plateColor = document.getElementById('plateColor');
const line1Input = document.getElementById('line1');
const line2Input = document.getElementById('line2');

[plateType, plateColor, line1Input, line2Input].forEach(elem => {
    elem.addEventListener('input', renderPlate);
});

document.getElementById('randomBtn').addEventListener('click', generateRandomData);
document.getElementById('downloadBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `plate_${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
});

function getRandomChar(str) {
    return str.charAt(Math.floor(Math.random() * str.length));
}

function generateRandomData() {
    const numbers = "0123456789";
    const letters = "ABCDEFGHKLMNPSTUVXYZ";

    // Format Dòng 1: 2 số tỉnh + 1 chữ cái + 1 ký tự (chữ hoặc số) => chuẩn 4 ký tự
    const prov1 = getRandomChar(numbers);
    const prov2 = getRandomChar(numbers);
    const serLetter = getRandomChar(letters);
    const serChar = Math.random() > 0.5 ? getRandomChar(numbers) : getRandomChar(letters);
    line1Input.value = `${prov1}${prov2}${serLetter}${serChar}`;

    // Format Dòng 2: 5 ký tự (dạng 123.45) hoặc 6 ký tự (dạng 123456 hoặc 123.456)
    const lengthChoice = Math.random() > 0.5 ? 5 : 6;
    if (lengthChoice === 5) {
        // Biển 5 số chuẩn: 3 số + chấm + 2 số (tổng 6 ký tự chuỗi, 5 ký tự số)
        line2Input.value = `${getRandomChar(numbers)}${getRandomChar(numbers)}${getRandomChar(numbers)}.${getRandomChar(numbers)}${getRandomChar(numbers)}`;
    } else {
        // Biển ngẫu nhiên 6 ký tự số liền mạch
        let val = "";
        for (let i = 0; i < 6; i++) val += getRandomChar(numbers);
        line2Input.value = val;
    }

    renderPlate();
}

function renderPlate() {
    const type = plateType.value;
    const l1 = line1Input.value.toUpperCase();
    const l2 = line2Input.value.toUpperCase();
    const color = plateColor.value;

    const width = type === 'long' ? 520 : 330;
    const height = type === 'long' ? 110 : 165;

    canvas.width = width;
    canvas.height = height;

    let bgColor = '#FFFFFF';
    let textColor = '#000000';
    let borderColor = '#000000';

    if (color === 'yellow') {
        bgColor = '#F5B041';
        textColor = '#000000';
        borderColor = '#000000';
    } else if (color === 'blue') {
        bgColor = '#1B4F72';
        textColor = '#FFFFFF';
        borderColor = '#FFFFFF';
    }

    // Nền
    ctx.fillStyle = bgColor;
    ctx.beginPath();
    ctx.roundRect(0, 0, width, height, 10);
    ctx.fill();

    // Viền kim loại ngoài
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#777777';
    ctx.stroke();

    // Viền trong
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = borderColor;
    ctx.beginPath();
    ctx.roundRect(5, 5, width - 10, height - 10, 6);
    ctx.stroke();

    // Typography
    ctx.fillStyle = textColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (type === 'long') {
        ctx.font = 'bold 54px "Bahnschrift", "DIN Alternate", "Arial", sans-serif';
        const fullText = `${l1} - ${l2}`;
        ctx.fillText(fullText, width / 2, height / 2 + 2);
    } else {
        ctx.font = 'bold 48px "Bahnschrift", "DIN Alternate", "Arial", sans-serif';
        ctx.fillText(l1, width / 2, height / 2 - 28);
        ctx.fillText(l2, width / 2, height / 2 + 34);
    }
}

window.onload = renderPlate;
</script>

</body>
</html>
